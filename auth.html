<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meridian · Sign In</title>
    <meta name="description" content="Sign in to Meridian — private, evidence‑based mental health support." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=IBM+Plex+Mono:ital,wght@0,300;0,400;1,300&family=Syne:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        /* ═══════════════════════════════════════════════════
           DESIGN TOKENS
           ═══════════════════════════════════════════════════ */
        :root {
            --bg: #F5F2EE;
            --dark: #0F0E0C;
            --fg: #1A1714;
            --fg-dark: #E8E4DF;
            --gold: #C4A882;
            --accent: #7A6A58;
            --muted: #9A8E82;
            --muted-dark: #6B6560;
            --rule: rgba(26, 23, 20, 0.08);
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.1);
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 300;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
            height: 100vh;
        }

        /* Film grain */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
        }

        .serif { font-family: 'Cormorant Garamond', serif; font-weight: 400; }

        .sans-label {
            font-family: 'Syne', sans-serif;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 600;
        }

        /* ═══════════════════════════════════════════════════
           SPLIT LAYOUT
           ═══════════════════════════════════════════════════ */
        .auth-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
        }

        /* ── Visual Panel (Left) ───────────────────────── */
        .auth-visual {
            background: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Grid overlay */
        .visual-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 55px 55px;
            pointer-events: none;
        }

        /* Animated gradient orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            will-change: transform;
        }

        .orb-1 {
            width: 350px;
            height: 350px;
            background: rgba(196, 168, 130, 0.35);
            top: 15%;
            left: 10%;
            animation: orbDrift1 20s ease-in-out infinite;
        }

        .orb-2 {
            width: 250px;
            height: 250px;
            background: rgba(184, 133, 108, 0.25);
            top: 50%;
            right: 5%;
            animation: orbDrift2 25s ease-in-out infinite;
        }

        .orb-3 {
            width: 280px;
            height: 280px;
            background: rgba(122, 106, 88, 0.2);
            bottom: 10%;
            left: 25%;
            animation: orbDrift3 22s ease-in-out infinite;
        }

        @keyframes orbDrift1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -70px) scale(1.08); }
            66% { transform: translate(-30px, 50px) scale(0.95); }
        }
        @keyframes orbDrift2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-50px, -40px) scale(1.12); }
            66% { transform: translate(35px, 60px) scale(0.9); }
        }
        @keyframes orbDrift3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(60px, -30px) scale(0.92); }
            66% { transform: translate(-40px, -50px) scale(1.1); }
        }

        .visual-content {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .visual-logo {
            font-size: 3rem;
            color: var(--fg-dark);
            letter-spacing: -0.02em;
            display: block;
            margin-bottom: 1rem;
        }

        .visual-tagline {
            color: var(--muted-dark);
            font-size: 0.85rem;
            line-height: 1.6;
            max-width: 280px;
        }

        .visual-rule {
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 1.5rem auto;
            border: none;
        }

        /* ── Auth Panel (Right) ────────────────────────── */
        .auth-panel {
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            animation: cardAppear 0.7s var(--ease-out) forwards;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo (mobile only) */
        .auth-logo {
            text-align: center;
            margin-bottom: 2.5rem;
            display: none;
        }

        .auth-logo a {
            text-decoration: none;
            color: var(--fg);
            font-size: 1.8rem;
            letter-spacing: -0.02em;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .logo-dot {
            width: 5px;
            height: 5px;
            background: var(--gold);
            border-radius: 50%;
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        /* ── Toggle Tabs ───────────────────────────────── */
        .auth-toggle {
            display: flex;
            justify-content: center;
            gap: 0;
            margin-bottom: 2.5rem;
            background: rgba(26, 23, 20, 0.03);
            border-radius: 12px;
            padding: 4px;
        }

        .auth-toggle button {
            flex: 1;
            background: none;
            border: none;
            font-family: 'Syne', sans-serif;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            padding: 0.8rem 1rem;
            border-radius: 9px;
            transition: all 0.3s var(--ease-out);
        }

        .auth-toggle button.active {
            color: var(--fg);
            background: #FFF;
            box-shadow: 0 2px 8px rgba(26, 23, 20, 0.06);
        }

        .auth-toggle button:hover:not(.active) {
            color: var(--fg);
        }

        /* ── Form Fields ───────────────────────────────── */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.65rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
            font-family: 'Syne', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(26, 23, 20, 0.08);
            border-radius: 12px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.9rem;
            color: var(--fg);
            outline: none;
            transition: all 0.4s var(--ease-out);
        }

        .form-group input:focus {
            border-color: var(--gold);
            background: #FFF;
            box-shadow: 0 0 0 3px rgba(196, 168, 130, 0.1), 0 4px 12px rgba(26, 23, 20, 0.04);
        }

        .form-group input::placeholder {
            color: var(--muted);
            opacity: 0.5;
        }

        /* ── Primary Button ────────────────────────────── */
        .btn-primary {
            width: 100%;
            background: var(--fg);
            color: var(--bg);
            border: none;
            border-radius: 100px;
            padding: 1rem 1.5rem;
            font-family: 'Syne', sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.5s var(--ease-spring);
            box-shadow: 0 8px 24px rgba(26, 23, 20, 0.12);
            margin-top: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 16px 32px -6px rgba(26, 23, 20, 0.25);
            background: #000;
        }

        .btn-primary:hover:not(:disabled)::after {
            transform: translateX(100%);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ── Status Messages ───────────────────────────── */
        .auth-error {
            color: #B07070;
            font-size: 0.8rem;
            margin-top: 1rem;
            text-align: center;
            min-height: 1.2em;
        }

        .auth-info {
            color: var(--muted);
            font-size: 0.85rem;
            text-align: center;
            line-height: 1.6;
        }

        .auth-info strong {
            color: var(--fg);
            font-weight: 500;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.3s;
        }

        .back-link:hover { color: var(--fg); }

        /* ── Email Confirmation ────────────────────────── */
        .email-sent {
            text-align: center;
            animation: cardAppear 0.6s var(--ease-out) forwards;
        }

        /* ═══════════════════════════════════════════════════
           RESPONSIVE
           ═══════════════════════════════════════════════════ */
        @media (max-width: 900px) {
            .auth-layout {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                position: relative;
                background: var(--bg);
            }

            .auth-visual {
                position: fixed;
                inset: 0;
                opacity: 0.15;
            }

            .auth-panel {
                position: relative;
                z-index: 1;
                background: transparent;
                width: 100%;
                max-width: 480px;
            }

            .auth-card {
                background: var(--glass-bg);
                backdrop-filter: blur(32px);
                -webkit-backdrop-filter: blur(32px);
                border: 1px solid var(--glass-border);
                border-radius: 28px;
                padding: 2.5rem 2rem;
                box-shadow: 0 20px 50px -12px rgba(26, 23, 20, 0.08),
                             inset 0 1px 0 rgba(255, 255, 255, 0.8);
            }

            .auth-logo { display: block; }
        }

        @media (max-width: 480px) {
            .auth-panel { padding: 1rem; }
            .auth-card { padding: 2rem 1.5rem; border-radius: 24px; }
        }
    </style>
</head>

<body>
    <div class="auth-layout">
        <!-- ── Visual Panel ─────────────────────────────── -->
        <div class="auth-visual" aria-hidden="true">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
            <div class="visual-grid"></div>
            <div class="visual-content">
                <span class="visual-logo serif">Meridian</span>
                <hr class="visual-rule" />
                <p class="visual-tagline">Private, evidence-based mental health support</p>
            </div>
        </div>

        <!-- ── Auth Panel ───────────────────────────────── -->
        <div class="auth-panel">
            <div class="auth-card" id="auth-card">
                <div class="auth-logo">
                    <a href="index.html" class="serif">Meridian<span class="logo-dot"></span></a>
                </div>

                <!-- Toggle tabs -->
                <div class="auth-toggle" id="auth-toggle">
                    <button id="login-tab" class="active">Sign In</button>
                    <button id="signup-tab">Create Account</button>
                </div>

                <!-- Sign In Form -->
                <form id="login-form" autocomplete="on">
                    <div class="form-group">
                        <label class="sans-label" for="login-email">Email</label>
                        <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email" />
                    </div>
                    <div class="form-group">
                        <label class="sans-label" for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="········" required autocomplete="current-password" />
                    </div>
                    <button type="submit" class="btn-primary" id="login-submit">Enter Portal</button>
                </form>

                <!-- Sign Up Form -->
                <form id="signup-form" style="display: none;" autocomplete="on">
                    <div class="form-group">
                        <label class="sans-label" for="signup-email">Email</label>
                        <input type="email" id="signup-email" placeholder="you@example.com" required autocomplete="email" />
                    </div>
                    <div class="form-group">
                        <label class="sans-label" for="signup-password">Password</label>
                        <input type="password" id="signup-password" placeholder="Min. 8 characters" required minlength="8" autocomplete="new-password" />
                    </div>
                    <button type="submit" class="btn-primary" id="signup-submit">Create Account</button>
                </form>

                <!-- Email confirmation message -->
                <div id="email-confirmation-msg" style="display: none;" class="email-sent">
                    <p class="auth-info">
                        <strong>Check your inbox.</strong><br><br>
                        We've sent a verification link to your email address.<br>
                        Click the link to complete your account, then come back here to sign in.
                    </p>
                    <button class="btn-primary" onclick="location.reload()" style="margin-top:1.5rem">I've verified — sign in</button>
                </div>

                <div class="auth-error" id="auth-error" aria-live="polite"></div>
                <a href="index.html" class="back-link">← Back to Meridian</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // These placeholders will be replaced by Vercel build script
        const SUPABASE_URL = '__SUPABASE_URL__';
        const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // DOM elements
        const loginTab = document.getElementById('login-tab');
        const signupTab = document.getElementById('signup-tab');
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const errorEl = document.getElementById('auth-error');
        const authToggle = document.getElementById('auth-toggle');
        const emailConfMsg = document.getElementById('email-confirmation-msg');

        // Toggle forms
        function showLoginForm() {
            loginTab.classList.add('active');
            signupTab.classList.remove('active');
            loginForm.style.display = 'block';
            signupForm.style.display = 'none';
            authToggle.style.display = 'flex';
            emailConfMsg.style.display = 'none';
            errorEl.textContent = '';
        }
        function showSignupForm() {
            signupTab.classList.add('active');
            loginTab.classList.remove('active');
            signupForm.style.display = 'block';
            loginForm.style.display = 'none';
            authToggle.style.display = 'flex';
            emailConfMsg.style.display = 'none';
            errorEl.textContent = '';
        }
        loginTab.addEventListener('click', showLoginForm);
        signupTab.addEventListener('click', showSignupForm);

        // Helper
        function setLoading(button, isLoading) {
            button.disabled = isLoading;
            button.textContent = isLoading ? 'Please wait…' : (button.id.includes('signup') ? 'Create Account' : 'Enter Portal');
        }

        // Handle ?confirmed=true query parameter
        async function handleEmailConfirmationRedirect() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('confirmed') !== 'true') return false;

            const { data: { session }, error } = await supabase.auth.getSession();
            if (session) {
                localStorage.setItem('sb_token', session.access_token);
                window.location.href = 'verified.html';
                return true;
            }
            errorEl.textContent = 'Verification successful. Please sign in.';
            history.replaceState(null, '', window.location.pathname);
            return false;
        }

        // Sign In
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-submit');
            errorEl.textContent = '';
            setLoading(btn, true);

            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                localStorage.setItem('sb_token', data.session.access_token);
                window.location.href = 'chat.html';
            } catch (err) {
                errorEl.textContent = err.message || 'Login failed. Check your credentials.';
            } finally {
                setLoading(btn, false);
            }
        });

        // Sign Up
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const btn = document.getElementById('signup-submit');
            errorEl.textContent = '';
            setLoading(btn, true);

            try {
                const { data, error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        emailRedirectTo: `${window.location.origin}/auth.html?confirmed=true`
                    }
                });

                if (error) throw error;

                if (data.session) {
                    localStorage.setItem('sb_token', data.session.access_token);
                    window.location.href = 'onboarding.html';
                    return;
                }

                loginForm.style.display = 'none';
                signupForm.style.display = 'none';
                authToggle.style.display = 'none';
                emailConfMsg.style.display = 'block';
                errorEl.textContent = '';

            } catch (err) {
                errorEl.textContent = err.message || 'Registration failed. Try a different email.';
            } finally {
                setLoading(btn, false);
            }
        });

        // On page load
        window.addEventListener('DOMContentLoaded', async () => {
            const handled = await handleEmailConfirmationRedirect();
            if (handled) return;

            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'chat.html';
                return;
            }

            showLoginForm();
        });
    </script>
</body>

</html>
