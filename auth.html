<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meridian · Sign In</title>
    <meta name="description" content="Sign in to Meridian — private, evidence‑based mental health support." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=IBM+Plex+Mono:ital,wght@0,300;0,400;1,300&family=Syne:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        /* same glass-card, noise, typography as before — unchanged from original */
        :root {
            --bg: #F5F2EE;
            --fg: #1A1714;
            --muted: #A09080;
            --dim: #6A605A;
            --accent: #7A6A58;
            --rule: rgba(26, 23, 20, 0.08);
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.1);
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: "";
            position: fixed;
            top: -20%;
            left: -10%;
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, rgba(122, 106, 88, 0.06) 0%, rgba(245, 242, 238, 0) 60%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(90px);
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
        }

        .serif {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
        }

        .sans-label {
            font-family: 'Syne', sans-serif;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 600;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            background: var(--glass-bg);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 3rem 2.5rem;
            box-shadow: 0 20px 50px -12px rgba(26, 23, 20, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .auth-logo a {
            text-decoration: none;
            color: var(--fg);
            font-size: 1.8rem;
            letter-spacing: -0.02em;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .logo-dot {
            width: 5px;
            height: 5px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.3;
                transform: scale(0.8);
            }
        }

        .auth-toggle {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--rule);
            padding-bottom: 1rem;
        }

        .auth-toggle button {
            background: none;
            border: none;
            font-family: 'Syne', sans-serif;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .auth-toggle button.active {
            color: var(--fg);
            border-bottom-color: var(--accent);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(26, 23, 20, 0.08);
            border-radius: 12px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.9rem;
            color: var(--fg);
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 12px rgba(26, 23, 20, 0.04);
        }

        .btn-primary {
            width: 100%;
            background: var(--fg);
            color: var(--bg);
            border: none;
            border-radius: 100px;
            padding: 1rem 1.5rem;
            font-family: 'Syne', sans-serif;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s var(--ease-spring);
            box-shadow: 0 8px 24px rgba(26, 23, 20, 0.12);
            margin-top: 0.5rem;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 16px 32px -6px rgba(26, 23, 20, 0.25);
            background: #000;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .auth-error {
            color: #B07070;
            font-size: 0.8rem;
            margin-top: 1rem;
            text-align: center;
            min-height: 1.2em;
        }

        .auth-info {
            color: var(--dim);
            font-size: 0.85rem;
            text-align: center;
            line-height: 1.6;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--dim);
        }

        /* email confirmation message */
        .email-sent {
            text-align: center;
            animation: msgAppear 0.6s var(--ease-out) forwards;
        }

        @keyframes msgAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="auth-card" id="auth-card">
        <div class="auth-logo">
            <a href="landing.html" class="serif">Meridian<span class="logo-dot"></span></a>
        </div>

        <!-- Toggle tabs (hidden when email sent) -->
        <div class="auth-toggle" id="auth-toggle">
            <button id="login-tab" class="active">Sign In</button>
            <button id="signup-tab">Create Account</button>
        </div>

        <!-- Sign In Form -->
        <form id="login-form" autocomplete="on">
            <div class="form-group">
                <label class="sans-label" for="login-email">Email</label>
                <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email" />
            </div>
            <div class="form-group">
                <label class="sans-label" for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="········" required
                    autocomplete="current-password" />
            </div>
            <button type="submit" class="btn-primary" id="login-submit">Enter Portal</button>
        </form>

        <!-- Sign Up Form (hidden by default) -->
        <form id="signup-form" style="display: none;" autocomplete="on">
            <div class="form-group">
                <label class="sans-label" for="signup-email">Email</label>
                <input type="email" id="signup-email" placeholder="you@example.com" required autocomplete="email" />
            </div>
            <div class="form-group">
                <label class="sans-label" for="signup-password">Password</label>
                <input type="password" id="signup-password" placeholder="Min. 8 characters" required minlength="8"
                    autocomplete="new-password" />
            </div>
            <button type="submit" class="btn-primary" id="signup-submit">Create Account</button>
        </form>

        <!-- Email confirmation message (hidden initially) -->
        <div id="email-confirmation-msg" style="display: none;" class="email-sent">
            <p class="auth-info">
                <strong>Check your inbox.</strong><br><br>
                We’ve sent a verification link to your email address.<br>
                Click the link to complete your account, then come back here to sign in.
            </p>
            <button class="btn-primary" onclick="location.reload()">I've verified — sign in</button>
        </div>

        <div class="auth-error" id="auth-error" aria-live="polite"></div>
        <a href="landing.html" class="back-link">← Back to Meridian</a>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // These placeholders will be replaced by Vercel build script
        const SUPABASE_URL = '__SUPABASE_URL__';
        const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // DOM elements
        const loginTab = document.getElementById('login-tab');
        const signupTab = document.getElementById('signup-tab');
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const errorEl = document.getElementById('auth-error');
        const authToggle = document.getElementById('auth-toggle');
        const emailConfMsg = document.getElementById('email-confirmation-msg');

        // Toggle forms
        function showLoginForm() {
            loginTab.classList.add('active');
            signupTab.classList.remove('active');
            loginForm.style.display = 'block';
            signupForm.style.display = 'none';
            authToggle.style.display = 'flex';
            emailConfMsg.style.display = 'none';
            errorEl.textContent = '';
        }
        function showSignupForm() {
            signupTab.classList.add('active');
            loginTab.classList.remove('active');
            signupForm.style.display = 'block';
            loginForm.style.display = 'none';
            authToggle.style.display = 'flex';
            emailConfMsg.style.display = 'none';
            errorEl.textContent = '';
        }
        loginTab.addEventListener('click', showLoginForm);
        signupTab.addEventListener('click', showSignupForm);

        // Helper
        function setLoading(button, isLoading) {
            button.disabled = isLoading;
            button.textContent = isLoading ? 'Please wait…' : (button.id.includes('signup') ? 'Create Account' : 'Enter Portal');
        }

        // ══════════════════════════════════════════
        // Handle ?confirmed=true query parameter
        // (after user clicks email verification link)
        // ══════════════════════════════════════════
        async function handleEmailConfirmationRedirect() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('confirmed') !== 'true') return false;

            // Wait a moment for Supabase to parse the token from the URL fragment
            // (Supabase puts access_token/refresh_token in the fragment after email redirect)
            const { data: { session }, error } = await supabase.auth.getSession();
            if (session) {
                localStorage.setItem('sb_token', session.access_token);
                window.location.href = 'verified.html';   // ← change this line
                return true;
            }
            // If no session yet, show a subtle message (shouldn't happen normally)
            errorEl.textContent = 'Verification successful. Please sign in.';
            // remove the ?confirmed from URL without reload
            history.replaceState(null, '', window.location.pathname);
            return false;
        }

        // ══════════════════════════════════════════
        // Sign In
        // ══════════════════════════════════════════
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-submit');
            errorEl.textContent = '';
            setLoading(btn, true);

            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                localStorage.setItem('sb_token', data.session.access_token);
                window.location.href = 'index.html';
            } catch (err) {
                errorEl.textContent = err.message || 'Login failed. Check your credentials.';
            } finally {
                setLoading(btn, false);
            }
        });

        // ══════════════════════════════════════════
        // Sign Up (with email confirmation)
        // ══════════════════════════════════════════
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const btn = document.getElementById('signup-submit');
            errorEl.textContent = '';
            setLoading(btn, true);

            try {
                const { data, error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        emailRedirectTo: `${window.location.origin}/auth.html?confirmed=true`
                    }
                });

                if (error) throw error;

                // If session exists -> email confirmation is disabled (user signed in immediately)
                if (data.session) {
                    localStorage.setItem('sb_token', data.session.access_token);
                    window.location.href = 'onboarding.html';
                    return;
                }

                // Email confirmation required – show "check your email" message
                // Hide forms and toggle, show confirmation message
                loginForm.style.display = 'none';
                signupForm.style.display = 'none';
                authToggle.style.display = 'none';
                emailConfMsg.style.display = 'block';
                errorEl.textContent = '';

            } catch (err) {
                errorEl.textContent = err.message || 'Registration failed. Try a different email.';
            } finally {
                setLoading(btn, false);
            }
        });

        // ══════════════════════════════════════════
        // On page load: check for confirmed redirect or existing session
        // ══════════════════════════════════════════
        window.addEventListener('DOMContentLoaded', async () => {
            // First, handle email confirmation redirect
            const handled = await handleEmailConfirmationRedirect();
            if (handled) return; // already redirected

            // If already logged in, go straight to chat
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'index.html';
                return;
            }

            // Otherwise, stay on auth page (default view)
            showLoginForm();
        });
    </script>
</body>

</html>
