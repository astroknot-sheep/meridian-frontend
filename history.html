<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meridian · Session History</title>
    <meta name="description" content="Review your previous Meridian conversations." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=IBM+Plex+Mono:ital,wght@0,300;0,400;1,300&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #F5F2EE;
            --dark: #0F0E0C;
            --fg: #1A1714;
            --fg-dark: #E8E4DF;
            --gold: #C4A882;
            --accent: #7A6A58;
            --muted: #9A8E82;
            --muted-dark: #6B6560;
            --rule: rgba(26, 23, 20, 0.08);
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.1);
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 300;
            min-height: 100vh;
            padding: 1.5rem;
            position: relative;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
        }

        .orb { position: fixed; border-radius: 50%; filter: blur(100px); pointer-events: none; z-index: -1; }
        .orb-1 { width: 380px; height: 380px; background: rgba(196,168,130,0.08); top: 10%; left: 5%; animation: od1 22s ease-in-out infinite; }
        .orb-2 { width: 280px; height: 280px; background: rgba(184,133,108,0.06); bottom: 15%; right: 10%; animation: od2 28s ease-in-out infinite; }
        @keyframes od1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(35px,50px)} }
        @keyframes od2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-25px,-40px)} }

        .serif { font-family: 'Cormorant Garamond', serif; font-weight: 400; }
        .sans-label { font-family: 'Syne', sans-serif; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.2em; font-weight: 600; }

        /* ── Navigation Bar ────────────────────────────── */
        .nav-bar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 2rem;
            margin-bottom: 3rem;
            background: rgba(245, 242, 238, 0.7);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            box-shadow: 0 8px 32px -8px rgba(26, 23, 20, 0.05),
                         inset 0 1px 0 rgba(255,255,255,0.9);
        }

        .nav-logo {
            font-size: 1.5rem;
            color: var(--fg);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            letter-spacing: -0.01em;
        }

        .nav-links { display: flex; gap: 2rem; align-items: center; }

        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.7rem;
            transition: color 0.3s;
            font-family: 'Syne', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 600;
        }

        .nav-links a:hover { color: var(--fg); }
        .nav-links a.active { color: var(--fg); }

        .btn-logout {
            background: transparent;
            border: 1px solid rgba(26, 23, 20, 0.08);
            padding: 0.5rem 1.2rem;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.4s var(--ease-out);
            font-family: 'Syne', sans-serif;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 600;
            color: var(--muted);
        }

        .btn-logout:hover {
            background: var(--fg);
            color: var(--bg);
            border-color: var(--fg);
        }

        /* ── History Card ──────────────────────────────── */
        .history-card {
            width: 100%;
            max-width: 800px;
            background: var(--glass-bg);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 16px 40px -12px rgba(26, 23, 20, 0.06),
                         inset 0 1px 0 rgba(255,255,255,0.8);
        }

        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            margin-bottom: 2rem;
            letter-spacing: -0.01em;
        }

        .session-list { display: flex; flex-direction: column; }

        .session-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            align-items: center;
            gap: 1rem;
            padding: 1.1rem 0.5rem;
            border-bottom: 1px solid var(--rule);
            font-size: 0.9rem;
            transition: all 0.3s;
            border-radius: 8px;
            margin: 0 -0.5rem;
        }

        .session-row:last-child { border-bottom: none; }
        .session-row:hover { background: rgba(255,255,255,0.4); }

        .session-date { font-weight: 400; }
        .session-mode { color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.7rem; }
        .session-modality { color: var(--gold); font-size: 0.7rem; text-transform: capitalize; }

        .session-link {
            color: var(--gold);
            text-decoration: none;
            font-size: 0.65rem;
            font-family: 'Syne', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 600;
            padding: 0.4rem 1rem;
            border: 1px solid rgba(196,168,130,0.2);
            border-radius: 100px;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .session-link:hover {
            background: rgba(196,168,130,0.1);
            border-color: var(--gold);
        }

        .empty-state { text-align: center; color: var(--muted); padding: 3rem 0; font-size: 0.9rem; line-height: 1.6; }

        .loading-state {
            text-align: center;
            color: var(--muted);
            padding: 3rem 0;
            animation: loadPulse 1.6s infinite;
        }

        @keyframes loadPulse { 0%,100%{opacity:0.5} 50%{opacity:1} }

        .error-state { text-align: center; color: #B07070; padding: 3rem 0; }

        /* ── Responsive ────────────────────────────────── */
        @media (max-width: 600px) {
            .nav-bar { flex-wrap: wrap; gap: 0.8rem; border-radius: 20px; padding: 0.8rem 1rem; }
            .nav-links { width: 100%; justify-content: space-between; }
            .history-card { padding: 2rem 1.5rem; border-radius: 20px; }
            .session-row { grid-template-columns: 1fr 1fr; gap: 0.5rem; }
            .session-link { grid-column: span 2; justify-self: end; }
        }
    </style>
</head>

<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <nav class="nav-bar">
        <a href="chat.html" class="nav-logo serif">Meridian</a>
        <div class="nav-links">
            <a href="chat.html">Chat</a>
            <a href="profile.html">Profile</a>
            <a href="history.html" class="active">History</a>
            <button id="logout-btn" class="btn-logout">Logout</button>
        </div>
    </nav>

    <div class="history-card">
        <h2 class="section-title serif">Your Sessions</h2>
        <div id="history-container" class="session-list">
            <div class="loading-state">Loading your sessions…</div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        const SUPABASE_URL = '__SUPABASE_URL__';
        const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const API_BASE = window.location.hostname === 'localhost'
            ? 'http://localhost:8000'
            : 'https://astroknotsheep-meridian-api.hf.space';

        function authHeaders() {
            const token = localStorage.getItem('sb_token');
            return token
                ? { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
                : { 'Content-Type': 'application/json' };
        }

        async function requireAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'auth.html'; return null; }
            localStorage.setItem('sb_token', session.access_token);
            return session;
        }

        async function loadSessions() {
            const container = document.getElementById('history-container');
            try {
                const res = await fetch(`${API_BASE}/profile/history`, { headers: authHeaders() });
                if (!res.ok) {
                    if (res.status === 401) {
                        localStorage.removeItem('sb_token');
                        window.location.href = 'auth.html';
                        return;
                    }
                    throw new Error('Failed to fetch history');
                }

                const sessions = await res.json();
                if (!sessions || sessions.length === 0) {
                    container.innerHTML = '<div class="empty-state">No sessions recorded yet.<br>Start a conversation in the Chat tab.</div>';
                    return;
                }

                container.innerHTML = sessions.map(session => {
                    const date = new Date(session.created_at);
                    const formattedDate = date.toLocaleDateString('en-US', {
                        month: 'short', day: 'numeric', year: 'numeric'
                    });
                    const mode = session.mode || 'therapy';
                    const modality = session.modality || '—';
                    const sessionId = session.id;
                    return `
                        <div class="session-row">
                            <div class="session-date">${formattedDate}</div>
                            <div class="session-mode">${mode}</div>
                            <div class="session-modality">${modality}</div>
                            <a href="chat.html?session=${sessionId}" class="session-link sans-label">Resume</a>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.error(err);
                container.innerHTML = '<div class="error-state">Unable to load sessions.<br>Please try again later.</div>';
            }
        }

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            localStorage.removeItem('sb_token');
            window.location.href = 'auth.html';
        });

        window.addEventListener('DOMContentLoaded', async () => {
            const session = await requireAuth();
            if (session) { loadSessions(); }
        });
    </script>
</body>

</html>
