<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meridian · Profile</title>
    <meta name="description" content="Manage your Meridian profile and view past sessions." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=IBM+Plex+Mono:ital,wght@0,300;0,400;1,300&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #F5F2EE;
            --dark: #0F0E0C;
            --fg: #1A1714;
            --fg-dark: #E8E4DF;
            --gold: #C4A882;
            --accent: #7A6A58;
            --muted: #9A8E82;
            --muted-dark: #6B6560;
            --rule: rgba(26, 23, 20, 0.08);
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.1);
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 300;
            min-height: 100vh;
            padding: 1.5rem;
            position: relative;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
        }

        .orb { position: fixed; border-radius: 50%; filter: blur(100px); pointer-events: none; z-index: -1; }
        .orb-1 { width: 400px; height: 400px; background: rgba(196,168,130,0.08); top: 5%; right: 10%; animation: od1 24s ease-in-out infinite; }
        .orb-2 { width: 300px; height: 300px; background: rgba(184,133,108,0.06); bottom: 10%; left: 5%; animation: od2 30s ease-in-out infinite; }
        @keyframes od1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-30px,50px)} }
        @keyframes od2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(40px,-30px)} }

        .serif { font-family: 'Cormorant Garamond', serif; font-weight: 400; }
        .sans-label { font-family: 'Syne', sans-serif; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.2em; font-weight: 600; }

        /* ── Navigation Bar ────────────────────────────── */
        .nav-bar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 2rem;
            margin-bottom: 3rem;
            background: rgba(245, 242, 238, 0.7);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            box-shadow: 0 8px 32px -8px rgba(26, 23, 20, 0.05),
                         inset 0 1px 0 rgba(255,255,255,0.9);
        }

        .nav-logo {
            font-size: 1.5rem;
            color: var(--fg);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            letter-spacing: -0.01em;
        }

        .nav-links { display: flex; gap: 2rem; align-items: center; }

        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.7rem;
            transition: color 0.3s;
            font-family: 'Syne', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 600;
        }

        .nav-links a:hover { color: var(--fg); }
        .nav-links a.active { color: var(--fg); }

        .btn-logout {
            background: transparent;
            border: 1px solid rgba(26, 23, 20, 0.08);
            padding: 0.5rem 1.2rem;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.4s var(--ease-out);
            font-family: 'Syne', sans-serif;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 600;
            color: var(--muted);
        }

        .btn-logout:hover {
            background: var(--fg);
            color: var(--bg);
            border-color: var(--fg);
        }

        /* ── Cards ─────────────────────────────────────── */
        .profile-card, .history-card {
            width: 100%;
            max-width: 750px;
            background: var(--glass-bg);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 16px 40px -12px rgba(26, 23, 20, 0.06),
                         inset 0 1px 0 rgba(255,255,255,0.8);
            margin-bottom: 2rem;
        }

        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            margin-bottom: 2rem;
            letter-spacing: -0.01em;
        }

        /* ── Form ──────────────────────────────────────── */
        .form-row { display: flex; flex-direction: column; gap: 1.5rem; margin-bottom: 2rem; }

        .form-group label {
            display: block;
            color: var(--accent);
            margin-bottom: 0.5rem;
            font-family: 'Syne', sans-serif;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%; padding: 0.85rem 1rem;
            background: rgba(255,255,255,0.8);
            border: 1px solid rgba(26,23,20,0.08);
            border-radius: 12px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.9rem; color: var(--fg); outline: none;
            transition: all 0.4s var(--ease-out);
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--gold);
            background: #FFF;
            box-shadow: 0 0 0 3px rgba(196,168,130,0.1), 0 4px 12px rgba(26,23,20,0.04);
        }

        .btn-primary {
            background: var(--fg); color: var(--bg);
            border: none; border-radius: 100px;
            padding: 0.85rem 2rem;
            font-family: 'Syne', sans-serif; font-size: 0.7rem;
            text-transform: uppercase; letter-spacing: 0.2em; font-weight: 600;
            cursor: pointer; transition: all 0.5s var(--ease-spring);
            box-shadow: 0 8px 24px rgba(26,23,20,0.12);
            position: relative; overflow: hidden;
        }
        .btn-primary::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent); transform:translateX(-100%); transition:transform 0.6s ease; }
        .btn-primary:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 16px 32px -6px rgba(26,23,20,0.25); background:#000; }
        .btn-primary:hover:not(:disabled)::after { transform:translateX(100%); }
        .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }

        .status-msg { margin-top: 1rem; font-size: 0.8rem; text-align: center; min-height: 1.2em; }
        .status-msg.success { color: #4A7A52; }
        .status-msg.error { color: #B07070; }

        /* ── Session History ────────────────────────────── */
        .session-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.1rem 0;
            border-bottom: 1px solid var(--rule);
            transition: background 0.3s;
        }

        .session-item:last-child { border-bottom: none; }
        .session-item:hover { background: rgba(255,255,255,0.3); margin: 0 -1rem; padding-left: 1rem; padding-right: 1rem; border-radius: 8px; }

        .session-date { font-size: 0.9rem; color: var(--fg); font-weight: 400; }
        .session-mode { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 0.2rem; }

        .session-link {
            color: var(--gold);
            text-decoration: none;
            font-size: 0.7rem;
            font-family: 'Syne', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 600;
            padding: 0.4rem 1rem;
            border: 1px solid rgba(196,168,130,0.2);
            border-radius: 100px;
            transition: all 0.3s;
        }

        .session-link:hover {
            background: rgba(196,168,130,0.1);
            border-color: var(--gold);
        }

        .empty-state { text-align: center; color: var(--muted); padding: 2.5rem 0; font-size: 0.9rem; }

        /* ── Responsive ────────────────────────────────── */
        @media (max-width: 600px) {
            .nav-bar { flex-wrap: wrap; gap: 0.8rem; border-radius: 20px; padding: 0.8rem 1rem; }
            .nav-links { width: 100%; justify-content: space-between; }
            .profile-card, .history-card { padding: 2rem 1.5rem; border-radius: 20px; }
        }
    </style>
</head>

<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <nav class="nav-bar">
        <a href="chat.html" class="nav-logo serif">Meridian</a>
        <div class="nav-links">
            <a href="chat.html">Chat</a>
            <a href="profile.html" class="active">Profile</a>
            <a href="history.html">History</a>
            <button id="logout-btn" class="btn-logout">Logout</button>
        </div>
    </nav>

    <div class="profile-card">
        <h2 class="section-title serif">Your Profile</h2>
        <form id="profile-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="display-name">Display Name</label>
                    <input type="text" id="display-name" placeholder="Your name" required autocomplete="name" />
                </div>
                <div class="form-group">
                    <label for="preferred-modality">Preferred Modality</label>
                    <select id="preferred-modality">
                        <option value="cbt">CBT</option>
                        <option value="act">ACT</option>
                        <option value="dbt">DBT</option>
                        <option value="mindfulness">Mindfulness</option>
                        <option value="sfbt">Solution-Focused</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn-primary" id="save-btn">Save Changes</button>
            <div class="status-msg" id="status-msg" aria-live="polite"></div>
        </form>
    </div>

    <div class="history-card">
        <h2 class="section-title serif">Past Sessions</h2>
        <div id="history-list">
            <div class="empty-state">Loading sessions…</div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        const SUPABASE_URL = '__SUPABASE_URL__';
        const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const API_BASE = window.location.hostname === 'localhost'
            ? 'http://localhost:8000'
            : 'https://astroknotsheep-meridian-api.hf.space';

        function authHeaders() {
            const token = localStorage.getItem('sb_token');
            return token
                ? { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
                : { 'Content-Type': 'application/json' };
        }

        async function requireAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'auth.html'; return null; }
            localStorage.setItem('sb_token', session.access_token);
            return session;
        }

        async function loadProfile() {
            try {
                const res = await fetch(`${API_BASE}/profile`, { headers: authHeaders() });
                if (!res.ok) throw new Error('Failed to fetch profile');
                const data = await res.json();
                document.getElementById('display-name').value = data.display_name || '';
                document.getElementById('preferred-modality').value = data.preferred_modality || 'cbt';
            } catch (err) {
                console.error(err);
                document.getElementById('status-msg').textContent = 'Could not load profile.';
                document.getElementById('status-msg').className = 'status-msg error';
            }
        }

        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            const statusEl = document.getElementById('status-msg');
            btn.disabled = true;
            btn.textContent = 'Saving…';
            statusEl.textContent = '';
            statusEl.className = 'status-msg';

            const payload = {
                display_name: document.getElementById('display-name').value.trim(),
                preferred_modality: document.getElementById('preferred-modality').value
            };

            try {
                const res = await fetch(`${API_BASE}/profile`, {
                    method: 'PUT',
                    headers: authHeaders(),
                    body: JSON.stringify(payload)
                });
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.detail || 'Update failed');
                }
                await supabase.auth.updateUser({ data: payload });
                statusEl.textContent = 'Profile updated.';
                statusEl.className = 'status-msg success';
            } catch (err) {
                statusEl.textContent = err.message || 'Something went wrong.';
                statusEl.className = 'status-msg error';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Save Changes';
            }
        });

        async function loadHistory() {
            const historyDiv = document.getElementById('history-list');
            try {
                const res = await fetch(`${API_BASE}/sessions`, { headers: authHeaders() });
                if (!res.ok) throw new Error('Failed to load sessions');
                const sessions = await res.json();

                if (!sessions || sessions.length === 0) {
                    historyDiv.innerHTML = '<div class="empty-state">No past sessions yet.</div>';
                    return;
                }

                historyDiv.innerHTML = sessions.map(s => `
                    <div class="session-item">
                        <div>
                            <div class="session-date">${new Date(s.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</div>
                            <div class="session-mode">${s.mode} · ${s.modality || '—'}</div>
                        </div>
                        <a href="chat.html?session=${s.id}" class="session-link">Resume</a>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                historyDiv.innerHTML = '<div class="empty-state">Unable to load history.</div>';
            }
        }

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            localStorage.removeItem('sb_token');
            window.location.href = 'auth.html';
        });

        const init = async () => {
            const session = await requireAuth();
            if (!session) return;
            await loadProfile();
            await loadHistory();
        };

        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>

</html>
